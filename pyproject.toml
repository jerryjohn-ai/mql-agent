[project]
name = "mql-agent"
version = "0.1.0"
description = "Enterprise MQL scoring agent: Claude scores, code decides, scoped MCP servers touch Salesforce."
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.69",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-sqlite>=2.0",
  "mcp[cli]>=1.27,<2",
  "simple-salesforce>=1.12",
  "pydantic>=2.7",
  "pyyaml>=6",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
mql = "mqlagent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mqlagent", "servers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
